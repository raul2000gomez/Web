<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tu cuenta · Cosas</title>
  <meta name="description" content="Entra con Google para tener tus listas de Cosas con y Cosas de en todos tus dispositivos.">
  <meta name="theme-color" content="#2F6FED">
  <script>
    /* Dentro de la app (su dominio también sirve esta página), el color de fondo que eligió el
       usuario, antes del primer pintado. Misma fórmula de tono que la app y js/util.js. */
    (function () {
      try {
        var datos = JSON.parse(localStorage.getItem('cosas:v1') || 'null');
        var color = datos && datos.ajustes && datos.ajustes.colorFondo;
        if (!/^#[0-9a-f]{6}$/i.test(color || '')) return;
        var canal = function (i) {
          var v = parseInt(color.substr(i, 2), 16) / 255;
          return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
        };
        var l = 0.2126 * canal(1) + 0.7152 * canal(3) + 0.0722 * canal(5) + 0.05;
        var raiz = document.documentElement;
        raiz.style.setProperty('--fondo', color);
        raiz.setAttribute('data-tono', 1.05 / l >= l / 0.0530353 ? 'oscuro' : 'claro');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', color);
      } catch (e) { /* Sin almacenamiento: el azul de la app. */ }
    })();
  </script>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/con.css?v=7">
</head>
<body>

  <!-- Tu cuenta: entrar con Google (la misma cuenta que Cosas con y Cosas de) o cerrar sesión.
       La app la abre desde sus ajustes con ?accion=entrar o ?accion=salir y vuelve a ellos al acabar. -->
  <main class="con-app" id="app">
    <section class="vista activa" aria-labelledby="titulo-cuenta">
      <header class="vista-cabecera">
        <a class="redondo" id="volver" href="../" aria-label="Volver"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11.5 18.5 5 12l6.5-6.5"/></svg></a>
        <h1 class="vista-titulo" id="titulo-cuenta" tabindex="-1">Tu cuenta</h1>
        <span aria-hidden="true"></span>
      </header>
      <div class="vacio-centrado" role="status" aria-live="polite">
        <p class="vacio-titulo" id="cuenta-titulo">Un momento…</p>
        <p class="vacio-texto" id="cuenta-texto"></p>
      </div>
      <div class="barra barra-accion" id="barra" hidden>
        <div class="pildora">
          <button type="button" class="boton-pildora" id="accion">Continuar con Google</button>
        </div>
      </div>
    </section>
  </main>

  <noscript><p style="padding:24px;text-align:center">Tu cuenta necesita JavaScript para funcionar.</p></noscript>

  <script src="../firebase-config.js"></script>
  <script type="module" src="../js/cuenta.js?v=1"></script>
</body>
</html>
