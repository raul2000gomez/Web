<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cosas</title>
  <meta name="robots" content="noindex">
  <!-- En un servidor sin redirecciones (GitHub Pages), /con/ID y /de/ID llegan aquí: se pasa
       la lista a la página con ?l=ID, que la abre y deja otra vez la dirección bonita. En Netlify
       las redirecciones de netlify.toml se adelantan y esta página solo sale con rutas que no existen. -->
  <script>
    (function () {
      var m = location.pathname.match(/^(.*?)\/(con|de)\/([A-Za-z0-9]{8,24})\/?$/);
      if (m) { location.replace(m[1] + '/' + m[2] + '/?l=' + m[3].toLowerCase() + location.hash); return; }
      var partes = location.pathname.split('/').filter(Boolean);
      var base = /\.github\.io$/.test(location.hostname) && partes.length ? '/' + partes[0] : '';
      var enlace = document.getElementById('inicio');
      if (enlace) enlace.href = base + '/';
      document.addEventListener('DOMContentLoaded', function () { document.getElementById('inicio').href = base + '/'; });
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F6F3EC; color: #16181D; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    @media (prefers-color-scheme: dark) { body { background: #111317; color: #F2F0EA; } }
    h1 { font-size: 28px; letter-spacing: -.02em; margin: 0 0 10px; }
    p { margin: 0 0 22px; opacity: .75; }
    a { display: inline-block; padding: 14px 24px; border-radius: 26px; background: #2F6FED; color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté incompleto.</p>
    <a id="inicio" href="/">Ir a Cosas</a>
  </div>
</body>
</html>
