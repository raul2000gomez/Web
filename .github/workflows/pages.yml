# Publica la web en GitHub Pages: cada cambio en main se copia a la rama gh-pages, que es la
# que sirve GitHub Pages (se activa sola al existir esa rama). No hay build: se sube tal cual.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar main a gh-pages
        run: git push --force origin HEAD:gh-pages
