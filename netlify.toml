# cosas.info · Netlify
# La web es estática: no hay build. «Cosas con» usa rutas bonitas (/con/ID),
# que se sirven todas desde /con/index.html.

[build]
  publish = "."

[[redirects]]
  from = "/con/*"
  to = "/con/index.html"
  status = 200

# «Cosas de …» tiene su propia página; /de/ID abre el grupo ID.
[[redirects]]
  from = "/de/*"
  to = "/de/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
